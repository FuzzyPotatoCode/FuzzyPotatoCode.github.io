<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The address carries a one-time sign-in code: never send it on to anyone. -->
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Back to Budget</title>
<style>
:root { --bg: #f7f5f0; --card: #ffffff; --ink: #1d1d1b; --soft: #6b6a66; --line: #e4e1d8; --accent: #c2541f; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #161615; --card: #1f1f1d; --ink: #ecebe6; --soft: #a3a19a; --line: #34332f; --accent: #f08a4b; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { max-width: 480px; margin: 0 auto; padding: 48px 16px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
h1 { font-size: 22px; margin: 0 0 8px; }
p { margin: 0 0 16px; color: var(--soft); }
a.button { display: block; text-align: center; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; padding: 14px; border-radius: 10px; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1 id="title">Taking you back to Budget</h1>
    <p id="text">If the app does not open by itself, tap the button.</p>
    <a class="button" id="open" href="#">Open Budget</a>
  </div>
</main>
<script>
  // BankSync sends the browser here with ?code=...&state=... (or ?error=...). The app reads
  // them through its own address; the code is single-use, expires in a minute and only
  // works together with a secret the app kept, so passing it on is safe.
  var query = window.location.search;
  var target = "budgetapp://callback" + query;
  document.getElementById("open").href = target;
  var params = new URLSearchParams(query);
  if (params.get("error")) {
    document.getElementById("title").textContent = "BankSync did not connect";
    document.getElementById("text").textContent =
      "Go back to Budget to try again. Tap the button to return.";
  } else if (!params.get("code")) {
    document.getElementById("title").textContent = "Nothing to hand back";
    document.getElementById("text").textContent =
      "This page finishes connecting a bank in the Budget app. Open the app to start.";
  }
  if (query) {
    window.location.replace(target);
  }
</script>
</body>
</html>
